services:
  db:
    image: docker.arvancloud.ir/postgres:15-alpine
    container_name: helpdesk_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tickets_db}
      - POSTGRES_USER=${POSTGRES_USER:-tickets_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-strong_password_here}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tickets_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helpdesk_network
    restart: unless-stopped

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    container_name: helpdesk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helpdesk_network
    restart: unless-stopped

  backend:
    build: .
    container_name: helpdesk_backend
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - POSTGRES_DB=${POSTGRES_DB:-tickets_db}
      - POSTGRES_USER=${POSTGRES_USER:-tickets_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-strong_password_here}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - helpdesk_network
    restart: unless-stopped

networks:
  helpdesk_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: